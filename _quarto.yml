project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - syllabus-web.qmd
    - lectures.qmd
    - assignments.qmd
    - LICENSE.qmd
    - "lectures/*/*.qmd"
  post-render:
    - "find . -name '*.quarto_ipynb*' -delete"

website:
  title: "DATASCI 101"
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: false
  repo-url: https://github.com/danilofreire/datasci101
  repo-actions: [issue, source]
  repo-branch: main
  navbar:
    pinned: true
    tools:
      - icon: github
        href: https://github.com/danilofreire/datasci101
    left:
      - href: syllabus-web.qmd
        text: Syllabus
        icon: journal-text
      - href: lectures.qmd
        text: Lectures
        icon: mortarboard
      - href: assignments.qmd
        text: Assignments
        icon: pencil-square
      - href: LICENSE.html
        text: " "
  page-footer: 
    left: "The content of this site is licensed under the [MIT License](LICENSE.qmd)." 
    right: 
      - icon: github
        href: https://github.com/danilofreire/datasci101

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss, custom-dark.scss]
    css: styles.css
    mainfont: "Source Sans 3"
    monofont: "Inconsolata"
    highlight-style: github
    toc: true
